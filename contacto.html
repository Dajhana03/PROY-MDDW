<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Contacto y soporte</h1>
    <p>Estamos aquí para ayudarte. Contáctanos por cualquiera de estos medios</p>

     <h2>Envíanos un Mensaje</h2>
      <div>
     <label for="class">Nombre</label>
     <input type="text" placeholder="Tu nombre">
    </div>
   <div>
    <label for="class">Apellido</label>
    <input type="text" placeholder="Tu Apellido">
   </div>
   <div>
    <label for="Email">Correo Electrónico</label>
    <input type="email" id="email" name="Email" placeholder="Tu correo">
   </div>
   <div>
    <label for="Asunto">Asunto</label>
     <select name="paises" id="paises">
  <option value="ST">Soporte técnico</option>
  <option value="PD">Pregunta sobre donaciones</option>
  <option value="ar">Problemas con puntos</option>
  <option value="Sug">Sugerencia</option>
  <option value="Otro">Otro</option>
</select>
   </div>
<div>
    <label for="class">Mensaje</label>
    <textarea name="txtArea" id="Area" placeholder="Cuéntanos en que podemos ayudarte..."></textarea>
</div>
<div>
    <button>Enviar Mensaje</button>
</div>


</body>
</html>
